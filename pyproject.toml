[project]
name = "sean-michael-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2",
    "boto3>=1.42.70",
    "click>=8.3.3",
    "idna>=3.15",
    "fastapi>=0.124.4",
    "jinja2>=3.1.6",
    "markdown>=3.10",
    "noaa-coops>=0.4.0",
    "python-frontmatter>=1.1.0",
    "python-multipart>=0.0.31",
    "ruff>=0.14.9",
    # Pin above PYSEC-2026-248/249 (fixed in starlette 1.3.1).
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "uvicorn[standard]>=0.38.0",
    # Transitive via noaa-coops; floor above PYSEC-2026-2323.
    "zeep>=4.3.3",
]

[project.scripts]
content = "scripts.content:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "scripts"]
