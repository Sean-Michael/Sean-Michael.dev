name: seanmichael-dev

# Lives on the EC2 box at /opt/app/docker-compose.yaml (copied there by the
# deploy workflow). Settings come from /opt/app/.env — see README.

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=seanm.riesterer@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    depends_on:
      - app

  app:
    image: ${DOCKER_IMAGE}
    container_name: app
    restart: unless-stopped
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
      # Public site.
      - "traefik.http.routers.app.rule=Host(`sean-michael.dev`) || Host(`www.sean-michael.dev`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app.service=app"
    networks:
      - traefik-public

  # Tides (Bellingham Tidal Observatory) lives in github.com/Sean-Michael/BTO, served at /tides.
  # Enabled by COMPOSE_PROFILES=tides in /opt/app/.env once its image is pushed.
  tides:
    image: ${TIDES_IMAGE:-bto:unset}  # set TIDES_IMAGE=<dockerhub user>/bto:latest in /opt/app/.env
    container_name: tides
    restart: unless-stopped
    profiles: ["tides"]
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tides.rule=Host(`sean-michael.dev`) && (PathPrefix(`/tides`) || PathPrefix(`/api/tides`))"
      - "traefik.http.routers.tides.priority=100"
      - "traefik.http.routers.tides.entrypoints=websecure"
      - "traefik.http.routers.tides.tls.certresolver=letsencrypt"
      - "traefik.http.services.tides.loadbalancer.server.port=8000"
    networks:
      - traefik-public

volumes:
  letsencrypt:

networks:
  traefik-public:
