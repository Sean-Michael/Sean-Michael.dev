{% extends "base.html" %}
{% block title %}Digest — Sean-Michael{% endblock %}
{% block content %}
<h1>Digest</h1>
<ul class="dated">
  {% for d in digests %}
  <li><time datetime="{{ d.date.isoformat() }}">{{ d.date.strftime("%Y-%m-%d") }}</time> <a href="{{ d.url }}">{{ d.title }}</a></li>
  {% else %}
  <li>Nothing here yet.</li>
  {% endfor %}
</ul>
{% endblock %}
