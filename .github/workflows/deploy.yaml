name: Build and Deploy

on:
  push:
    branches:
      - main
  # ai-newstand sends this after it uploads a new digest to S3.
  repository_dispatch:
    types: [digest-published]
  # Weekly backstop in case a dispatch ever goes missing (expired token, GitHub outage).
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one waits rather than cancelling one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Test
        run: uv run pytest -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch digests from S3
        run: aws s3 sync "s3://${{ vars.S3_CONTENT_BUCKET || 'smr-webdev-content' }}/digests/" content/digests/ --exclude "*" --include "*.md"

      - name: Build
        run: uv run python -m app.build --out dist --digests content/digests --check-images

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
